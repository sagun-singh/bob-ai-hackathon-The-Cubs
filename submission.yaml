submission:
  title: "FIR Intelligence & Crime Pattern Detector"                        # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Police FIRs are often stored as unstructured text, making it difficult to identify similar crimes and repeat-offender patterns 
    efficiently. The proposed system uses AI to analyze mock FIRs, classify crimes, extract key details, and detect repeated crime 
    patterns.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
   An AI-powered FIR Intelligence tool that processes multiple FIRs, identifies crime types and important entities, compares crime 
   patterns, and generates a station-level summary with flagged repeat-offender signatures.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "AI-powered FIR classification using watsonx.ai"                     # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Automatic extraction of accused, location, MO and victim details"
    - "Repeat-offender pattern detection using text similarity"
    - "Automated crime trend analysis and station-level summaries"         # optional 4th
    - "Interactive dashboard for FIR insights and flagged crime patterns"  # optional 5th

  tech_stack:
    languages: ["Python"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: []                     # e.g., ["FastAPI", "React"]
    ibm_technologies: []               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: []                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Replace with what aspect of the submission you consider strongest
    and want judges to pay special attention to.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

